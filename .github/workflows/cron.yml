name: LMS Mail Reminder Cron

on:
  schedule:
    - cron: "0 0 */2 * *" 
  workflow_dispatch:

jobs:
  call-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call LMS reminder API (POST)
        run: |
          echo "Calling LMS reminder API via POST..."
          curl -X POST https://lms-mail-reminder.onrender.com/send-reminders
